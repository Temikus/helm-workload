suite: test services
templates:
  - deployment.yaml
  - service.yaml
tests:
  - it: should match basic snapshot
    set:
      image.tag: "test"
      .Release.Name: "foo"
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
        - name: baz
          port: 8080
          service:
            enabled: true
    asserts:
      - matchSnapshot:
          path: spec

  - it: should have the correct number of services depending on values
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
        - name: baz
          port: 8080
          service:
            enabled: false
    asserts:
      - hasDocuments:
          count: 2
          isKind:
            of: Service

  - it: should take name from a port if not set in service
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: foo-RELEASE-NAME-workload

  - it: should take name from a service name field if set
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
            name: bar
    asserts:
      - equal:
          path: metadata.name
          value: bar-RELEASE-NAME-workload

  - it: should take name from a service nameOverride field if set
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
            nameOverride: bar
    asserts:
      - equal:
          path: metadata.name
          value: bar

  - it: should set correct service type when specified
    template: service.yaml
    set:
      ports:
        - name: smbd
          port: 445
          service:
            enabled: true
            type: LoadBalancer
            port: 446
        - name: http
          port: 80
          service:
            enabled: true
            type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        documentIndex: 0
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 446
        documentIndex: 0

  - it: should default to ClusterIP when type not specified
    template: service.yaml
    set:
      ports:
        - name: http
          port: 80
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should render extraServices as a multi-port service
    template: service.yaml
    set:
      extraServices:
        - name: device-mgmt
          type: LoadBalancer
          ports:
            - name: discovery
              port: 29810
              targetPort: discovery
              protocol: UDP
            - name: manager
              port: 29811
              targetPort: manager
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: device-mgmt-RELEASE-NAME-workload
      - equal:
          path: spec.type
          value: LoadBalancer
      - lengthEqual:
          path: spec.ports
          count: 2
      - contains:
          path: spec.ports
          content:
            name: discovery
            port: 29810
            targetPort: discovery
            protocol: UDP
      - contains:
          path: spec.ports
          content:
            name: manager
            port: 29811
            targetPort: manager
            protocol: TCP

  - it: should render extraServices alongside port-derived services
    template: service.yaml
    set:
      ports:
        - name: http
          port: 80
          service:
            enabled: true
      extraServices:
        - name: device-mgmt
          type: LoadBalancer
          ports:
            - name: discovery
              port: 29810
              protocol: UDP
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Service
        documentIndex: 0
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 0
      - isKind:
          of: Service
        documentIndex: 1
      - equal:
          path: spec.type
          value: LoadBalancer
        documentIndex: 1

  - it: should default extraServices targetPort to port name
    template: service.yaml
    set:
      extraServices:
        - name: mgmt
          ports:
            - name: http
              port: 8080
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: should default extraServices type to ClusterIP
    template: service.yaml
    set:
      extraServices:
        - name: mgmt
          ports:
            - name: http
              port: 8080
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should render extraServices annotations when provided
    template: service.yaml
    set:
      extraServices:
        - name: mgmt
          annotations:
            my-annotation: "my-value"
          ports:
            - name: http
              port: 8080
    asserts:
      - equal:
          path: metadata.annotations.my-annotation
          value: "my-value"
