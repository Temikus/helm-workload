suite: test services
templates:
  - deployment.yaml
  - service.yaml
tests:
  - it: should match basic snapshot
    set:
      image.tag: "test"
      .Release.Name: "foo"
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
        - name: baz
          port: 8080
          service:
            enabled: true
    asserts:
      - matchSnapshot:
          path: spec

  - it: should have the correct number of services depending on values
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
        - name: baz
          port: 8080
          service:
            enabled: false
    asserts:
      - hasDocuments:
          count: 2
          isKind:
            of: Service

  - it: should take name from a port if not set in service
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: foo-RELEASE-NAME-workload

  - it: should take name from a service name field if set
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
            name: bar
    asserts:
      - equal:
          path: metadata.name
          value: bar-RELEASE-NAME-workload

  - it: should take name from a service nameOverride field if set
    template: service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
            nameOverride: bar
    asserts:
      - equal:
          path: metadata.name
          value: bar

  - it: should set correct service type when specified
    template: service.yaml
    set:
      ports:
        - name: smbd
          port: 445
          service:
            enabled: true
            type: LoadBalancer
            port: 446
        - name: http
          port: 80
          service:
            enabled: true
            type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        documentIndex: 0
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 446
        documentIndex: 0

  - it: should default to ClusterIP when type not specified
    template: service.yaml
    set:
      ports:
        - name: http
          port: 80
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
