set:
  ingress:
    enabled: true
    annotations:
      "kubernetes.io/ingress.class": "traefik"
      "cert-manager.io/cluster-issuer": "digitalocean-dns-production-issuer"
    hosts:
      - host: workload-release-name.example.com
        paths:
          - path: "/"
            pathType: ImplementationSpecific
    tls:
      - secretName: workload-release-name-tls
        hosts:
          - workload-release-name.example.com
tests:
  - it: should match generic snapshot
    values:
      - ../values.yaml
    templates:
      - ingress.yaml
      - service.yaml
    set:
      service:
        port: 80
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
    asserts:
      - matchSnapshot:
          path: spec

  - it: should point to the correct service with default values
    templates:
      - ingress.yaml
      - service.yaml
    set:
      service:
        port: 80
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: foo
        template: service.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: foo-RELEASE-NAME-workload
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: "/"
        template: ingress.yaml

  - it: should point to the first port with default values if service name is not set
    templates:
      - ingress.yaml
      - service.yaml
    set:
      ports:
        - name: foo
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: foo-RELEASE-NAME-workload
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: "/"
        template: ingress.yaml

  - it: should point to the first port with default values if service name is set
    templates:
      - ingress.yaml
      - service.yaml
    set:
      ports:
        - name: baz
          port: 80
          service:
            enabled: true
        - name: bar
          port: 443
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: baz-RELEASE-NAME-workload
        template: ingress.yaml

  - it: should take the name from the port service name field if set
    templates:
      - ingress.yaml
      - service.yaml
    set:
      ports:
        - name: bar
          port: 80
          service:
            enabled: true
            name: baz
        - name: bar
          port: 443
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: baz-RELEASE-NAME-workload
        template: ingress.yaml

  - it: should add additional paths and backends if set
    templates:
      - ingress.yaml
      - service.yaml
    set:
      ingress:
        enabled: true
        annotations:
          "kubernetes.io/ingress.class": "traefik"
          "cert-manager.io/cluster-issuer": "digitalocean-dns-production-issuer"
        hosts:
          - host: workload-release-name.example.com
            paths:
              - path: "/"
                pathType: ImplementationSpecific
              - path: "/foo"
                pathType: ImplementationSpecific
                backend:
                  service:
                    name: bar
                    port:
                      number: 443
        tls:
          - secretName: workload-release-name-tls
            hosts:
              - workload-release-name.example.com
      ports:
        - name: bar
          port: 80
          service:
            enabled: true
            name: baz
        - name: bar
          port: 443
          service:
            enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: baz-RELEASE-NAME-workload
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: bar
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.number
          value: 443
        template: ingress.yaml
