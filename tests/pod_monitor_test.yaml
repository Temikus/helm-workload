suite: PodMonitor
templates:
  - pod_monitor.yaml
tests:
  - it: should not create PodMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create PodMonitor when enabled
    set:
      podMonitor:
        enabled: true
        endpoints:
          - port: http
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-workload

  - it: should select the main pods and exclude the postgres addon pod
    set:
      podMonitor:
        enabled: true
        endpoints:
          - port: http
    asserts:
      - equal:
          path: spec.selector
          value:
            matchLabels:
              app.kubernetes.io/name: workload
              app.kubernetes.io/instance: RELEASE-NAME
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values:
                  - postgres

  - it: should add extra labels next to the chart labels
    set:
      podMonitor:
        enabled: true
        labels:
          release: monitoring
        endpoints:
          - port: http
    asserts:
      - equal:
          path: metadata.labels.release
          value: monitoring
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should render endpoints verbatim
    set:
      podMonitor:
        enabled: true
        endpoints:
          - port: http
            path: /metrics
            interval: 60s
          - port: admin
            scheme: https
            relabelings:
              - action: labeldrop
                regex: pod
    asserts:
      - equal:
          path: spec.podMetricsEndpoints
          value:
            - port: http
              path: /metrics
              interval: 60s
            - port: admin
              scheme: https
              relabelings:
                - action: labeldrop
                  regex: pod

  - it: should fail when enabled without endpoints
    set:
      podMonitor:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "podMonitor.endpoints must list at least one endpoint when podMonitor.enabled is true"
