suite: test serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: should not create serviceaccount when creation is disabled
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create basic serviceaccount when enabled
    set:
      serviceAccount:
        create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - exists:
          path: metadata.name

  - it: should set custom name when provided
    set:
      serviceAccount:
        create: true
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should set annotations when provided
    set:
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/my-role"

  - it: should use default name when not specified
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-workload

  - it: should set standard labels
    set:
      serviceAccount:
        create: true
    asserts:
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/name"]
          pattern: workload
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/instance"]
          pattern: RELEASE-NAME

  - it: should handle multiple annotations
    set:
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
          custom.annotation/value: "test-value"
          another.annotation: "another-value"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/my-role"
      - equal:
          path: metadata.annotations["custom.annotation/value"]
          value: "test-value"
      - equal:
          path: metadata.annotations["another.annotation"]
          value: "another-value"
