suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: should work
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      image.repository: "nginx"
      image.tag: "latest"
      .Release.Name: "foo"
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -workload$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: pod spec should match snapshot
    set:
      image.tag: "test"
    asserts:
      - matchSnapshot:
          path: spec.template.spec
  - it: should reference the env-configmap if .Values.env are set
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      env:
        FOO: "bar"
        BAZ: "qux"
    asserts:
      - matchSnapshot:
          path: spec.template.spec.containers[0].envFrom
  - it: should be able to set capabilities and securityContext
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
        sysctls:
          - name: net.ipv6.conf.all.disable_ipv6
            value: "0"
    asserts:
      - matchSnapshot:
          path: spec.template.spec.containers[0].securityContext

  - it: should not set strategy when not configured
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy

  - it: should set strategy when configured
    template: deployment.yaml
    set:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: should support Recreate strategy
    template: deployment.yaml
    set:
      strategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: should not include volume mounts when none are configured
    set: {}
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value: null

  - it: should handle legacy host volumes format
    set:
      volumes:
        host:
          - name: config
            hostPath: /etc/host/config
            containerPath:
              path: /etc/config
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/config
      - equal:
          path: spec.template.spec.volumes[0].name
          value: config
      - notExists:
          path: spec.template.spec.volumes[0].containerPath

  - it: should handle host volumes format
    set:
      volumes:
        host:
          - name: config
            hostPath:
              path: /etc/host/config
              type: Directory
            containerPath:
              path: /etc/config
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/config
      - equal:
          path: spec.template.spec.volumes[0].name
          value: config
      - equal:
          path: spec.template.spec.volumes[0].hostPath.path
          value: /etc/host/config
      - equal:
          path: spec.template.spec.volumes[0].hostPath.type
          value: Directory
      - notExists:
          path: spec.template.spec.volumes[0].containerPath

  - it: should handle direct volumeMounts format
    set:
      volumeMounts:
        - name: logs
          mountPath: /var/log
          readOnly: true
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: logs
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/log
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
