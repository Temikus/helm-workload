suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: should work
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      image.repository: "nginx"
      image.tag: "latest"
      .Release.Name: "foo"
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -workload$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: pod spec should match snapshot
    asserts:
      - matchSnapshot:
          path: spec.template.spec
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should reference the env-configmap if .Values.env are set
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      env:
        FOO: "bar"
        BAZ: "qux"
    asserts:
      - matchSnapshot:
          path: spec.template.spec.containers[0].envFrom
  - it: should be able to set capabilities and securityContext
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
        sysctls:
          - name: net.ipv6.conf.all.disable_ipv6
            value: "0"
    asserts:
      - matchSnapshot:
          path: spec.template.spec.containers[0].securityContext

  - it: should not include volume mounts when none are configured
    set: {}
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value: null

  - it: should handle legacy host volumes format
    set:
      volumes:
        host:
          - name: config
            containerPath:
              path: /etc/config
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/config

  - it: should handle direct volumeMounts format
    set:
      volumeMounts:
        - name: logs
          mountPath: /var/log
          readOnly: true
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: logs
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/log
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
