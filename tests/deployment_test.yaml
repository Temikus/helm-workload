suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: should work
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      image.repository: "nginx"
      image.tag: "latest"
      .Release.Name: "foo"
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -workload$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: pod spec should match snapshot
    asserts:
      - matchSnapshot:
          path: spec.template.spec
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should reference the env-configmap if .Values.env are set
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      env:
        FOO: "bar"
        BAZ: "qux"
    asserts:
      - matchSnapshot:
          path: spec.template.spec.containers[0].envFrom
  - it: should be able to set capabilities and securityContext
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
        sysctls:
          - name: net.ipv6.conf.all.disable_ipv6
            value: "0"
    asserts:
      - matchSnapshot:
          path: spec.template.spec.containers[0].securityContext