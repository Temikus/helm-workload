suite: test env secret
templates:
  - env_secret.yaml
  - deployment.yaml
tests:
  - it: should not create a Secret when secretEnv is not set
    template: env_secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create an Opaque Secret with stringData from secretEnv
    template: env_secret.yaml
    set:
      secretEnv:
        API_KEY: s3cr3t
        EMPTY: ""
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-workload-env
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: stringData.API_KEY
          value: s3cr3t
      - equal:
          path: stringData.EMPTY
          value: ""
      - notExists:
          path: data

  - it: should set standard labels
    template: env_secret.yaml
    set:
      secretEnv:
        API_KEY: s3cr3t
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: workload
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should reference the Secret from the main container without an env ConfigMap
    template: deployment.yaml
    set:
      secretEnv:
        API_KEY: s3cr3t
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-workload-env
