# Path: workload/tests/addons_vpn_test.yaml
suite: test addons integration
templates:
  - deployment.yaml
  - statefulset.yaml
tests:
  - it: should not add vpn sidecar to deployment by default
    values:
      - ../values.yaml
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: workload

  - it: should add vpn sidecar to deployment when enabled
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      addons:
        vpn:
          enabled: true
          provider:
            name: mullvad
            type: openvpn
          openvpn:
            auth:
              username: test-user
              password: test-pass
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[0].name
          value: gluetun
      - equal:
          path: spec.template.spec.containers[1].name
          value: workload
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/qdm12/gluetun:latest

  - it: should add vpn sidecar to statefulset when enabled
    values:
      - ../values.yaml
    template: statefulset.yaml
    set:
      persistence:
        enabled: true
        type: statefulset
      addons:
        vpn:
          enabled: true
          provider:
            name: mullvad
            type: openvpn
          openvpn:
            auth:
              username: test-user
              password: test-pass
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[1].name
          value: workload
      - equal:
          path: spec.template.spec.containers[0].name
          value: gluetun

  - it: should create proper volume configuration when persistence is enabled
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      addons:
        vpn:
          enabled: true
          provider:
            name: mullvad
            type: openvpn
          openvpn:
            auth:
              username: test-user
              password: test-pass
          persistence:
            enabled: true
            size: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: gluetun-config
      - exists:
          path: spec.template.spec.volumes[0].persistentVolumeClaim
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: gluetun-config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /gluetun

  - it: should properly set OpenVPN environment variables
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      addons:
        vpn:
          enabled: true
          provider:
            name: mullvad
            type: openvpn
          openvpn:
            auth:
              username: test-user
              password: test-pass
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "VPN_SERVICE_PROVIDER")].value
          pattern: mullvad
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "VPN_TYPE")].value
          pattern: openvpn
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OPENVPN_USER")].value
          pattern: test-user
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OPENVPN_PASSWORD")].value
          pattern: test-pass