suite: test postgres addon integration
templates:
  - deployment.yaml
  - statefulset.yaml
  - pvc.yaml
  - postgres.yaml
tests:
  - it: should not create postgres deployment by default
    values:
      - ../values.yaml
    template: postgres.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a separate postgres Deployment when enabled
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          image:
            repository: example.com/postgres
            tag: 1.2.3
          auth:
            username: postgres
            password: postgres-password
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-workload-postgres
      - equal:
          path: spec.template.spec.containers[0].name
          value: postgres
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/postgres:1.2.3
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should create a postgres Service when enabled
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 1
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-workload-postgres
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.ports[0].targetPort
          value: postgres

  - it: should NOT add postgres container to main deployment when enabled
    values:
      - ../values.yaml
    template: deployment.yaml
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: workload

  - it: should NOT add postgres container to statefulset when enabled
    values:
      - ../values.yaml
    template: statefulset.yaml
    set:
      persistence:
        enabled: true
        type: statefulset
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
    asserts:
      - isKind:
          of: StatefulSet
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: workload

  - it: should not set security context on postgres deployment by default
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: should use the defined security context when explicitly set on postgres deployment
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 70
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 70
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 70

  - it: should create proper volume configuration when persistence is enabled
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
          persistence:
            enabled: true
            size: 8Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: postgres-data
      - exists:
          path: spec.template.spec.volumes[0].persistentVolumeClaim
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: postgres-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/postgresql/data

  - it: should create a PVC when persistence is enabled
    values:
      - ../values.yaml
    template: pvc.yaml
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
          persistence:
            enabled: true
            size: 8Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 8Gi

  - it: should properly set PostgreSQL environment variables
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: testuser
            password: testpassword
            database: testdb
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_USER")].value
          pattern: testuser
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_PASSWORD")].value
          pattern: testpassword
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_DB")].value
          pattern: testdb

  - it: should support existing secret for password
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: testuser
            existingSecret: postgres-credentials
            existingSecretKey: password
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_PASSWORD")].valueFrom.secretKeyRef
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: postgres-credentials
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_PASSWORD")].valueFrom.secretKeyRef.key
          value: password

  - it: should set custom resources on postgres deployment
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should have correct labels on postgres deployment
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: postgres

  - it: should use custom service port
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 1
    set:
      addons:
        postgres:
          enabled: true
          auth:
            username: postgres
            password: postgres-password
          service:
            port: 5433
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 5433

  - it: should not set runtimeClassName on postgres by default
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          auth:
            password: postgres-password
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should set postgres runtimeClassName when given
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      addons:
        postgres:
          enabled: true
          runtimeClassName: kata
          auth:
            password: postgres-password
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: kata

  - it: should not inherit the top-level runtimeClassName on postgres
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 0
    set:
      runtimeClassName: gvisor
      addons:
        postgres:
          enabled: true
          auth:
            password: postgres-password
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should render only Deployment and Service when networkPolicy is unset
    values:
      - ../values.yaml
    template: postgres.yaml
    set:
      addons:
        postgres:
          enabled: true
          auth:
            password: postgres-password
    asserts:
      - hasDocuments:
          count: 2

  - it: should restrict postgres ingress to the release's main pods
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 2
    release:
      name: myapp
    set:
      addons:
        postgres:
          enabled: true
          auth:
            password: postgres-password
          networkPolicy:
            enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: myapp-workload-postgres
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: workload
            app.kubernetes.io/instance: myapp
            app.kubernetes.io/component: postgres
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - equal:
          path: spec.ingress
          value:
            - ports:
                - protocol: TCP
                  port: 5432
              from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: workload
                      app.kubernetes.io/instance: myapp
                    matchExpressions:
                      - key: app.kubernetes.io/component
                        operator: NotIn
                        values:
                          - postgres

  - it: should target container port 5432 even with a custom service port
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 2
    set:
      addons:
        postgres:
          enabled: true
          auth:
            password: postgres-password
          service:
            port: 5433
          networkPolicy:
            enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 5432

  - it: should append extra peers to the postgres NetworkPolicy
    values:
      - ../values.yaml
    template: postgres.yaml
    documentIndex: 2
    set:
      addons:
        postgres:
          enabled: true
          auth:
            password: postgres-password
          networkPolicy:
            enabled: true
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/instance: other-app
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 2
      - equal:
          path: spec.ingress[0].from[1]
          value:
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: other-app
