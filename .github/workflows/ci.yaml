name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: v1.2.1
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        # Helm 4 can only verify tarball installs, and only against the maintainer's GPG key.
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"

      - name: Lint
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .

  validate-manifests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (README prerequisite) and newest available schemas.
        kubernetes-version: ["1.26.15", "1.37.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: just test manifests ${{ matrix.kubernetes-version }}
