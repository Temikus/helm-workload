name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest plugin
        # TODO: Remove --verify=false once helm-unittest publishes signed releases
        # Tracking: https://github.com/helm-unittest/helm-unittest/issues/362
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest

      - name: Lint
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .
