name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write
  contents: read

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: v1.2.1
  CHART_REPO: oci://ghcr.io/temikus/helm-charts

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches chart version
        run: |
          CHART_VERSION=$(awk '/^version:/ {print $2}' Chart.yaml)
          if [ "${GITHUB_REF_NAME}" != "v${CHART_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${CHART_VERSION}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        # Helm 4 can only verify tarball installs, and only against the maintainer's GPG key.
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"

      - name: Lint
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Refuse to overwrite a published version
        # GHCR accepts a push to an existing tag and replaces the artifact.
        run: |
          if helm show chart "${CHART_REPO}/workload" --version "${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::workload ${GITHUB_REF_NAME#v} is already published"
            exit 1
          fi

      - name: Package chart
        run: helm package .

      - name: Push chart
        run: helm push workload-*.tgz "${CHART_REPO}"
