# Default values for workload.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ports: []
  # - name: http
  #   containerPort: 80
  #   servicePort: 80
  #   protocol: TCP
  #   expose: true
  #   serviceType: ClusterIP
  #   servicePortNameOverride: webui
  #   containerPortNameOverride: webui

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts: []
    #    - host: chart-example.local
    #      paths:
    #        - path: /
    #          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

persistence:
  enabled: false
  # size: 10Gi
  # storageClassName: standard
  # accessModes:
  #   - ReadWriteOnce
  # selectorLabels: {}
  # mountPath: /data
  # subPath: ""
  # extraVolumes: []
  # - name: logs
  #   size: 5Gi
  #   mountPath: /app/logs
  #   storageClassName: standard
  #   accessModes:
  #     - ReadWriteOnce
  #   labels: {}
  #   annotations: {}
  #   selectorLabels: {}
  #   subPath: ""
  #   readOnly: false
  # - name: config
  #   size: 1Gi
  #   mountPath: /app/config
  #   accessModes:
  #     - ReadWriteOnce

volumes:
  host: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

health:
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: http

hostNetwork:
  enabled: false
addons:
  init:
    enabled: false
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    command: [ ]
    securityContext: { }
    volumeMounts: [ ]
  vpn:
    enabled: false
    image:
      repository: ghcr.io/qdm12/gluetun
      tag: latest
      pullPolicy: Always
    provider:
      name: ""
      type: ""
    openvpn:
      auth: {}
    wireguard: {}
    config:
      timezone: UTC
      serverSelection: {}
    portForward:
      enabled: false
    persistence:
      enabled: false
      size: 1Gi
  postgres:
    enabled: false
    image:
      repository: postgres
      tag: 15-alpine
      pullPolicy: IfNotPresent
    auth:
      username: postgres
      password: postgres-password
      database: postgres
    securityContext:
      runAsUser: 999
      runAsGroup: 999
    persistence:
      enabled: false
      size: 10Gi
      existingClaim: ""